name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Cancel superseded runs on the same PR / ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  quality-gates:
    name: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history isn't needed for quality gates; keep the checkout fast.
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit + integration tests
        run: bun test

      - name: Coverage gate (>= 80% per ADR-001)
        run: bun run scripts/test-coverage-gate.ts

  # ─── STORAGE-FU-5-FU-F — fixture-based integration suite ────────────────
  # Runs the per-processor integration suites under
  # `tests/integration/processors/*.integration.test.ts` against real
  # binaries (ffmpeg, libreoffice, clamav). Decoupled from the
  # `quality-gates` job because the binary installs + clamav definition
  # download add ~2 minutes of latency that should not block fast PR
  # feedback on unit-test failures.
  #
  # Hard-fail mode (`STORAGE_INTEGRATION_PROCESSORS_REQUIRED=1`) is
  # applied PER-STEP only on the suites whose dependencies this job
  # actually provisions (sharp + ffmpeg + clamav). The libreoffice
  # suite is invoked separately WITHOUT the hard-fail flag so it
  # soft-skips cleanly when `LIBREOFFICE_SERVICE_URL` is unset
  # (covered by the future sidecar-rollout step, see FU-G).
  integration-processors:
    name: integration-processors
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      clamd:
        # Pin to the current LTS family (1.4). The 1.3 family is no
        # longer published by Cisco-Talos on Docker Hub; only the
        # last two minor families ship as plain tags.
        image: clamav/clamav:1.4
        ports:
          - 3310:3310
        options: >-
          --health-cmd "echo PING | nc -w 2 localhost 3310 | grep -q PONG"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 120s
    env:
      CLAMD_HOST: "127.0.0.1"
      CLAMD_PORT: "3310"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      # The fixtures are committed binaries — the integration suite
      # reads them directly. The `apt-get` step below installs ffmpeg
      # (the sharp + ffmpeg processors run in-process per FU-E §2)
      # and libreoffice-core (the FU-C processor speaks to a sidecar
      # but the CI smoke runs against a local soffice binary; the
      # FU-C runner falls back to the sidecar URL only when set, and
      # `LIBREOFFICE_SERVICE_URL` is intentionally NOT set on this
      # job so the libreoffice integration suite soft-skips. A
      # future CI iteration can add a sidecar container as a service
      # to exercise the suite end-to-end).
      - name: Install processor binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          # `clamav-daemon` is provided by the `clamd` service container above.
          # `libreoffice-core` is NOT installed — the libreoffice suite
          # requires the FU-G sidecar URL (LIBREOFFICE_SERVICE_URL),
          # which is filed as a separate rollout step.

      - name: Wait for clamd signature database
        run: |
          # clamd needs the signature DB to be loaded before it
          # accepts INSTREAM requests. The `freshclam` baked into the
          # `clamav/clamav` image downloads the DB at container start.
          # The healthcheck above waits up to 120s; we add a final
          # bounded retry here to surface a clear error if it still
          # hasn't loaded.
          for i in {1..60}; do
            if echo PING | nc -w 2 127.0.0.1 3310 | grep -q PONG; then
              echo "clamd is responsive"
              exit 0
            fi
            sleep 5
          done
          echo "clamd did not become responsive within 5 minutes" >&2
          exit 1

      # ─── Hard-fail suites (Codex P1 fix) ─────────────────────────────
      # Sharp + ffmpeg + clamav all have their dependencies provisioned
      # by this job. `STORAGE_INTEGRATION_PROCESSORS_REQUIRED=1` is
      # scoped to this step ONLY so silent skips on these three
      # processors would fail the build. The libreoffice suite is
      # deliberately excluded because `LIBREOFFICE_SERVICE_URL` is not
      # set on this job (the FU-G sidecar is a separate rollout step).
      - name: Run hard-fail suites (sharp + ffmpeg + clamav)
        env:
          STORAGE_INTEGRATION_PROCESSORS_REQUIRED: "1"
        run: |
          bun test \
            tests/integration/processors/sharp.integration.test.ts \
            tests/integration/processors/ffmpeg.integration.test.ts \
            tests/integration/processors/clamav.integration.test.ts

      # ─── Soft-skip suite (libreoffice) ───────────────────────────────
      # Runs WITHOUT `STORAGE_INTEGRATION_PROCESSORS_REQUIRED=1` so a
      # missing `LIBREOFFICE_SERVICE_URL` soft-skips cleanly. When the
      # FU-G sidecar rollout lands, this step will be merged back into
      # the hard-fail suite above with the sidecar wired in.
      - name: Run soft-skip suite (libreoffice)
        run: bun test tests/integration/processors/libreoffice.integration.test.ts

  # ─── STORAGE-FU-2-FU-3 — DB integration suite ────────────────────────────
  # Runs the 100+ integration tests under
  # `tests/infra/db/repositories/` against a real Postgres 17 service
  # container. Decoupled from `quality-gates` because Supabase CLI
  # install + canonical migration application add ~60s of latency.
  #
  # Hard-fail mode (`STORAGE_INTEGRATION_DB_REQUIRED=1`) flips the
  # existing soft-skip in `_db.ts::connectOrSkip()` to a thrown error
  # so silent skips can no longer hide integration-test breakage in CI.
  # The error message is credential-sanitized — see `sanitizeUrlForLogging`
  # in `_db.ts`.
  #
  # The canonical Supabase migrations live in `xynes-infra` (separate
  # private repo under the same `Xynes-Studio` org). This job checks
  # out `xynes-infra` into a sibling directory via a PAT stored in the
  # `XYNES_INFRA_READ_TOKEN` repo secret. Required scope: `repo:read`
  # on `Xynes-Studio/xynes-infra`. When the secret is absent (e.g. a
  # fork PR) the checkout step skips and the rest of the job is
  # skipped via `if:` — there is no graceful fallback because without
  # the migrations the integration suite cannot run, and silently
  # skipping the entire job would defeat FU-3's purpose.
  integration-db:
    name: integration-db
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip the job entirely when the cross-repo PAT is unavailable
    # (typical for community fork PRs). Internal PRs run the full
    # job. The skip emits a notice via `if:` so reviewers see why.
    if: ${{ vars.STORAGE_FU_3_ENABLED != 'false' }}
    services:
      # Vanilla Postgres works because the canonical storage migrations
      # only need the standard `postgres` role + `pgcrypto` / `uuid-ossp`
      # extensions (already in the base image). The `supabase/postgres`
      # image bundles a `docker-entrypoint-initdb.d/migrate.sh` that
      # expects `supabase_admin` to pre-exist and is incompatible with
      # GHA service-container usage (the init script hard-fails before
      # the container becomes healthy). Pin the minor so a Postgres
      # bump cannot silently break CI.
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    env:
      # `_db.ts::connectOrSkip()` reads these. The URL points at the
      # service container above; `REQUIRED=1` flips the soft-skip to
      # a hard-fail (FU-3's primary acceptance criterion).
      STORAGE_INTEGRATION_DB_URL: "postgresql://postgres:postgres@127.0.0.1:5432/postgres"
      STORAGE_INTEGRATION_DB_REQUIRED: "1"
    steps:
      - name: Checkout xynes-storage-service
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: xynes-storage-service

      - name: Checkout xynes-infra (canonical Supabase migrations)
        uses: actions/checkout@v4
        with:
          repository: Xynes-Studio/xynes-infra
          # PAT with `repo:read` on `Xynes-Studio/xynes-infra`. Stored
          # as a repo secret on `Xynes-Studio/xynes-storage-service`.
          # WHEN ADDING TO A NEW REPO: rotate the PAT every 90 days
          # per the org's credential-rotation policy.
          token: ${{ secrets.XYNES_INFRA_READ_TOKEN }}
          fetch-depth: 1
          path: xynes-infra
          ref: main

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('xynes-storage-service/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (frozen lockfile)
        working-directory: xynes-storage-service
        run: bun install --frozen-lockfile

      - name: Install Supabase CLI
        # Pinned to a specific minor so a CLI bump cannot silently
        # change migration behaviour. Bump intentionally.
        run: |
          curl -fsSL "https://github.com/supabase/cli/releases/download/v2.30.4/supabase_linux_amd64.tar.gz" \
            -o /tmp/supabase.tar.gz
          tar -xzf /tmp/supabase.tar.gz -C /tmp
          sudo install /tmp/supabase /usr/local/bin/supabase
          supabase --version

      - name: Apply canonical Supabase migrations to the service container
        working-directory: xynes-infra
        env:
          # Supabase CLI reads `--db-url` for the `db push` subcommand,
          # which applies every migration in `supabase/migrations/` in
          # timestamp order against an EXISTING Postgres instance.
          # This avoids spinning up `supabase db start` (which would
          # try to run its own Docker stack inside the runner).
          DB_URL: "postgresql://postgres:postgres@127.0.0.1:5432/postgres"
        run: |
          # `db push` requires the migrations be tracked by the CLI's
          # internal versioning. The simplest robust path: psql-apply
          # every migration in order. The CLI itself uses psql under
          # the hood for the same operation.
          for f in supabase/migrations/*.sql; do
            echo "Applying: $f"
            PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres \
              -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Verify canonical schema is in place
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 \
            -c "SELECT to_regclass('platform.storage_objects');" \
            -c "SELECT to_regclass('platform.storage_object_references');" \
            -c "SELECT to_regclass('identity.users');" \
            -c "SELECT to_regclass('platform.workspaces');"

      - name: Drizzle mirror drift check (db:check)
        working-directory: xynes-storage-service
        # Tell the drift check where the canonical migrations live in
        # this CI layout (sibling directory rather than relative
        # `../xynes-infra/...`).
        env:
          STORAGE_INFRA_MIGRATION_PATH: ${{ github.workspace }}/xynes-infra/supabase/migrations/20260513090000_universal_storage_platform_schema.sql
          STORAGE_INFRA_EXTRA_MIGRATION_PATHS: ${{ github.workspace }}/xynes-infra/supabase/migrations/20260528090000_storage_object_references_and_dedup_index.sql:${{ github.workspace }}/xynes-infra/supabase/migrations/20260528100000_storage_processing_jobs_active_unique_index.sql:${{ github.workspace }}/xynes-infra/supabase/migrations/20260529090000_storage_processing_jobs_payload_and_required.sql
        run: bun run db:check

      - name: Run DB integration suite (STORAGE_INTEGRATION_DB_REQUIRED=1)
        working-directory: xynes-storage-service
        run: |
          bun test tests/infra/db/repositories/ tests/infra/processors/variant-writer.integration.test.ts
