# Generated from xynes-infra scripts/setup/ci-quality-profiles.json.
name: "Required quality gates"
"on":
  pull_request:
    branches:
      - "main"
      - "develop"
      - "release/*"
  push:
    branches:
      - "main"
      - "develop"
      - "release/*"
  workflow_dispatch: {}
permissions:
  contents: "read"
concurrency:
  group: "quality-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  gates:
    name: "${{ matrix.gate }}"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        gate:
          - "lint"
          - "test"
          - "coverage"
          - "typecheck"
          - "build"
    env:
      GATE_NAME: "${{ matrix.gate }}"
      NODE_ENV: "test"
      RUN_INTEGRATION_TESTS: "false"
      XYNES_ENV_FILE: ".github/ci/fixture.env"
    steps:
      -
        uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
        with:
          persist-credentials: false
      -
        uses: "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6"
        with:
          bun-version: "1.4.2"
      -
        run: "printf '%s\\n' 'NODE_ENV=test' 'RUN_INTEGRATION_TESTS=false' 'DATABASE_URL=postgresql://fixture:fixture@127.0.0.1:1/security_fixture' 'ACCOUNTS_DATABASE_URL=postgresql://fixture:fixture@127.0.0.1:1/security_fixture' > .github/ci/fixture.env"
      -
        run: "bun install --frozen-lockfile"
      -
        run: |
          case "$GATE_NAME" in
            lint)
              bun run lint
              ;;
            test)
              bun run test
              ;;
            coverage)
              bun .github/ci/coverage-gate.ts test:coverage
              ;;
            typecheck)
              bun run typecheck
              ;;
            build)
              bun build --target=bun --outdir dist src/index.ts
              ;;
            *) exit 2 ;;
          esac
