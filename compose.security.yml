# Apply LAST; requires Compose >= 2.24.4. Paths resolve relative to the base file.
services:
  storage-service:
    build:
      target: prod
    command: !reset null
    volumes: !reset []
    # Replace the shared backend env file and inherited environment map. Supply
    # only storage's DB/internal/provider credentials and processor settings.
    env_file: !override
      - ${STORAGE_RUNTIME_ENV_FILE:?Set a storage-only runtime env file}
    environment: !override
      NODE_ENV: production
      STORAGE_PROCESSOR_MODE: live
      PORT: ${STORAGE_SERVICE_PORT:-4204}
    user: bun
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 2.0
    # ffmpeg needs bounded scratch space; no app/dependency writes are allowed.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
